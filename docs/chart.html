<!DOCTYPE html>
<html>
<head>
  <title>Fig 6.1 - Biometric Performance Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <style>
    body { display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background:#fff; font-family:'Times New Roman',serif; }
    .container { width:800px; padding:40px; }
    h3 { text-align:center; font-size:14px; margin-top:20px; }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="chart"></canvas>
    <h3>Fig 6.1: Performance Metrics of Biometric AI Modules</h3>
  </div>
  <script>
    Chart.register(ChartDataLabels);
    new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels: ['Face Recognition', 'Anti-Spoofing', 'Coercion Detection'],
        datasets: [
          { label: 'Precision', data: [92.1, 96.0, 95.7], backgroundColor: '#1f3864', borderWidth: 0 },
          { label: 'Recall',    data: [89.0, 98.0, 94.6], backgroundColor: '#4472c4', borderWidth: 0 },
          { label: 'F1-Score',  data: [90.4, 97.0, 94.5], backgroundColor: '#a9c4e8', borderWidth: 0 },
          { label: 'Accuracy',  data: [91.0, 97.0, 98.0], backgroundColor: '#5ba4cf', borderWidth: 0 },
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { font: { family: "'Times New Roman'", size: 13 }, padding: 20, usePointStyle: true, pointStyle: 'rect' } },
          datalabels: { anchor: 'end', align: 'top', font: { family: "'Times New Roman'", size: 11 }, color: '#333', formatter: v => v.toFixed(1) }
        },
        scales: {
          y: { min: 85, max: 100, title: { display: true, text: 'Percentage (%)', font: { family: "'Times New Roman'", size: 14, weight: 'bold' } },
               ticks: { font: { family: "'Times New Roman'", size: 12 }, stepSize: 1 },
               grid: { color: '#e0e0e0' } },
          x: { title: { display: true, text: 'Biometric AI Modules', font: { family: "'Times New Roman'", size: 14, weight: 'bold' } },
               ticks: { font: { family: "'Times New Roman'", size: 12 } },
               grid: { display: false } }
        },
        layout: { padding: { top: 20 } }
      }
    });
  </script>
</body>
</html>
